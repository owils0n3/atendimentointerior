<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Registro SUS Offline</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Registro SUS" />
  <meta name="theme-color" content="#F2F2F7" />

  <style>
    :root {
      --bg-primary: #F2F2F7;
      --bg-elevated: #FFFFFF;
      --bg-glass: rgba(242, 242, 247, 0.88);
      --bg-segmented: #E5E5EA;
      
      --primary: #0A84FF;
      --primary-gradient: linear-gradient(180deg, #0A84FF 0%, #0062D2 100%);
      --primary-light: #F0F6FF;
      --primary-dark: #0051B5;
      
      --success: #34C759;
      --success-bg: #E8F5E9;
      --warning: #FF9500;
      --warning-bg: #FFF4E5;
      --danger: #FF3B30;
      --danger-bg: #FFF1F0;
      
      --text-primary: #1C1C1E;
      --text-secondary: #636366;
      --text-muted: #8E8E93;
      
      --border-hairline: rgba(60, 60, 67, 0.14);
      --border-strong: #D1D1D6;

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--border-hairline);
      padding-top: calc(env(safe-area-inset-top) + 12px);
      padding-bottom: 14px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .app-shell {
      max-width: 720px;
      margin: 0 auto;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand-title span {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 99px;
      background: var(--success-bg);
      color: var(--success);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 0.5px solid rgba(52, 199, 89, 0.3);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ios-card {
      background: var(--bg-elevated);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 0.5px solid var(--border-hairline);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-banner {
      background: var(--primary-light);
      border: 0.5px solid rgba(10, 132, 255, 0.2);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .date-banner label {
      color: var(--primary-dark);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .date-banner small {
      font-size: 0.76rem;
      color: var(--text-secondary);
      display: block;
      margin-top: 6px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      font-size: 0.95rem;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      background: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .quick-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .chip {
      background: var(--bg-segmented);
      border: 0.5px solid var(--border-strong);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
    }

    .chip:active {
      background: var(--border-strong);
    }

    .btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:active { opacity: 0.85; transform: scale(0.98); }
    .btn-sm { height: 32px; padding: 0 10px; font-size: 0.78rem; width: auto; border-radius: 8px; }
    
    .btn-primary { 
      background: var(--primary-gradient); 
      color: #FFFFFF; 
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.25);
    }
    
    .btn-success { background: var(--success); color: #FFFFFF; }
    .btn-outline { background: var(--bg-primary); color: var(--text-primary); border: 0.5px solid var(--border-strong); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }

    .patient-item {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .patient-info h4 {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .patient-meta {
      font-size: 0.76rem;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 480px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-primary);
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 300;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div class="app-shell">
      <div class="nav-bar">
        <div class="brand-title">
          <span>Clínica / Interior</span>
          <h1>🦷 Registro SUS Offline</h1>
        </div>
        <div class="status-badge">
          🟢 Salvo no Aparelho
        </div>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- FORMULÁRIO DE CADASTRO NA ORDEM SOLICITADA -->
    <div class="ios-card">
      <div class="card-header">
        <span class="card-title">📝 Novo Atendimento</span>
      </div>
      <form id="formPaciente" onsubmit="salvarPaciente(event)">
        
        <!-- 1. Data do Atendimento -->
        <div class="form-group date-banner">
          <label>📅 Data do Atendimento</label>
          <input type="date" id="dataAtendimento" />
          <small>Fixa para lançar o dia inteiro sem precisar redigitar.</small>
        </div>

        <!-- 2. Nome da Comunidade / UBS -->
        <div class="form-group">
          <label>Nome da Comunidade / Unidade</label>
          <input type="text" id="inputComunidade" placeholder="Ex: UBS Urbana ou Ariramba" />
        </div>

        <!-- 3. Nome Completo do Paciente -->
        <div class="form-group">
          <label>Nome Completo do Paciente</label>
          <input type="text" id="inputNome" placeholder="Ex: Maria de Nazaré Silva" />
        </div>

        <!-- 4 & 5. CPF e Cartão SUS (Teclado numérico) -->
        <div class="grid-2 form-group">
          <div>
            <label>CPF</label>
            <input type="tel" id="inputCpf" placeholder="Somente números" inputmode="numeric" />
          </div>
          <div>
            <label>Cartão SUS</label>
            <input type="tel" id="inputSus" placeholder="Somente números" inputmode="numeric" />
          </div>
        </div>

        <!-- 6 & 7. Data de Nascimento e Procedimento -->
        <div class="grid-2 form-group">
          <div>
            <label>Data de Nascimento</label>
            <input type="tel" id="inputNascimento" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" />
          </div>
          <div>
            <label>Procedimento / Dente</label>
            <input type="text" id="inputProcedimento" placeholder="Ex: Exodontia dente 36" />
          </div>
        </div>

        <div class="quick-chips">
          <div class="chip" onclick="preencherProc('Exodontia dente ')">+ Exodontia</div>
          <div class="chip" onclick="preencherProc('Restauração resina dente ')">+ Restauração</div>
          <div class="chip" onclick="preencherProc('Profilaxia / Raspagem')">+ Profilaxia</div>
          <div class="chip" onclick="preencherProc('Aplicação tópica de flúor')">+ Flúor</div>
          <div class="chip" onclick="preencherProc('Atendimento de Urgência')">+ Urgência</div>
          <div class="chip" onclick="preencherProc('Consulta odontológica primeira vez')">+ 1ª Consulta</div>
        </div>

        <div style="margin-top: 16px;">
          <button type="submit" class="btn btn-primary">✅ Salvar Paciente na Data Acima</button>
        </div>
      </form>
    </div>

    <!-- LISTA DE PACIENTES SALVOS -->
    <div class="ios-card">
      <div class="card-header">
        <span class="card-title" id="tituloContador">Pacientes Salvos (0)</span>
        <select id="filtroData" onchange="renderizarPacientes()" style="width: auto; height: 32px; font-size: 0.78rem; padding: 0 8px;">
          <option value="todas">Todas as Datas</option>
        </select>
      </div>

      <div id="listaPacientes" class="patient-list">
        <p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:20px;">Nenhum paciente registrado ainda.</p>
      </div>

      <div class="grid-2" style="margin-top: 14px;">
        <button class="btn btn-success" onclick="baixarPlanilhaCSV()">📥 Baixar Planilha CSV</button>
        <button class="btn btn-outline" onclick="copiarParaColar()">📋 Copiar p/ Colar</button>
      </div>
    </div>

  </div>

  <div id="toast">Salvo!</div>

  <script>
    const STORAGE_KEY = 'rocha_batista_sus_offline_v3';

    let estado = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      pacientes: []
    };

    // Data de hoje padrão
    const hojeStr = new Date().toISOString().split('T')[0];
    document.getElementById('dataAtendimento').value = hojeStr;

    // Máscara automática para Data de Nascimento (DD/MM/AAAA)
    const inputNasc = document.getElementById('inputNascimento');
    inputNasc.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 8);
      if (v.length >= 5) {
        v = `${v.slice(0,2)}/${v.slice(2,4)}/${v.slice(4)}`;
      } else if (v.length >= 3) {
        v = `${v.slice(0,2)}/${v.slice(2)}`;
      }
      e.target.value = v;
    });

    function salvarNoAparelho() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));
      renderizarPacientes();
    }

    function preencherProc(texto) {
      document.getElementById('inputProcedimento').value = texto;
      document.getElementById('inputProcedimento').focus();
    }

    function salvarPaciente(e) {
      e.preventDefault();
      const dataAtendimento = document.getElementById('dataAtendimento').value;
      const comunidade = document.getElementById('inputComunidade').value.trim();
      const nome = document.getElementById('inputNome').value.trim();
      const cpf = document.getElementById('inputCpf').value.trim();
      const sus = document.getElementById('inputSus').value.trim();
      const nascimento = document.getElementById('inputNascimento').value.trim();
      const procedimento = document.getElementById('inputProcedimento').value.trim();

      const novoPaciente = {
        id: 'pac_' + Date.now(),
        dataAtendimento,
        comunidade,
        nome: nome || 'Paciente sem nome',
        cpf,
        sus,
        nascimento,
        procedimento
      };

      estado.pacientes.unshift(novoPaciente);
      salvarNoAparelho();

      // Limpa apenas os dados do paciente, mantendo a data e a comunidade fixas para facilitar
      document.getElementById('inputNome').value = '';
      document.getElementById('inputCpf').value = '';
      document.getElementById('inputSus').value = '';
      document.getElementById('inputNascimento').value = '';
      document.getElementById('inputProcedimento').value = '';
      document.getElementById('inputNome').focus();

      mostrarToast('✅ Paciente salvo offline!');
    }

    function excluirPaciente(id) {
      estado.pacientes = estado.pacientes.filter(p => p.id !== id);
      salvarNoAparelho();
      mostrarToast('🗑️ Paciente removido');
    }

    function formatarDataBR(dataIso) {
      if (!dataIso) return '';
      const partes = dataIso.split('-');
      if (partes.length !== 3) return dataIso;
      return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function renderizarPacientes() {
      const filtro = document.getElementById('filtroData').value;
      
      const datasUnicas = [...new Set(estado.pacientes.map(p => p.dataAtendimento))].sort().reverse();
      const selectFiltro = document.getElementById('filtroData');
      const valAtual = selectFiltro.value;
      
      selectFiltro.innerHTML = '<option value="todas">Todas as Datas</option>' + 
        datasUnicas.map(d => `<option value="${d}">${formatarDataBR(d)}</option>`).join('');
      selectFiltro.value = datasUnicas.includes(valAtual) ? valAtual : 'todas';

      const listaFiltrada = filtro === 'todas' ? 
        estado.pacientes : 
        estado.pacientes.filter(p => p.dataAtendimento === filtro);

      document.getElementById('tituloContador').textContent = `Pacientes Salvos (${listaFiltrada.length})`;

      const container = document.getElementById('listaPacientes');
      if (listaFiltrada.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:0.85rem;padding:20px;">Nenhum paciente encontrado.</p>';
        return;
      }

      container.innerHTML = listaFiltrada.map(p => `
        <div class="patient-item">
          <div class="patient-info">
            <h4>${escapeHTML(p.nome)} ${p.comunidade ? `<span style="font-size:0.75rem; color:var(--primary); font-weight:normal;">(${escapeHTML(p.comunidade)})</span>` : ''}</h4>
            <div class="patient-meta">
              CPF: ${escapeHTML(p.cpf || 'Não informado')} | SUS: ${escapeHTML(p.sus || 'Não informado')}<br/>
              Nasc: ${escapeHTML(p.nascimento || 'Não informada')} | <strong>Proc:</strong> ${escapeHTML(p.procedimento || 'Não informado')}<br/>
              <span style="color:var(--primary); font-weight:600;">Atendimento: ${formatarDataBR(p.dataAtendimento)}</span>
            </div>
          </div>
          <button class="btn btn-danger btn-sm" onclick="excluirPaciente('${p.id}')">Excluir</button>
        </div>
      `).join('');
    }

    // ORDEM EXATA DA PLANILHA: Nome, CPF, SUS, Data de Nascimento, Procedimento (e Comunidade)
    function baixarPlanilhaCSV() {
      if (estado.pacientes.length === 0) {
        mostrarToast('⚠️ Nenhum paciente para exportar');
        return;
      }

      let csv = '\uFEFFNome;CPF;SUS;DataNascimento;Procedimento;Comunidade;DataAtendimento\n';
      estado.pacientes.forEach(p => {
        csv += `"${p.nome}";"${p.cpf}";"${p.sus}";"${p.nascimento}";"${p.procedimento}";"${p.comunidade}";"${formatarDataBR(p.dataAtendimento)}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `registro_sus_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      mostrarToast('📥 Planilha baixada!');
    }

    function copiarParaColar() {
      if (estado.pacientes.length === 0) {
        mostrarToast('⚠️ Nenhum paciente para copiar');
        return;
      }

      let texto = '';
      estado.pacientes.forEach((p, idx) => {
        texto += `--- Paciente ${idx + 1} ---\n`;
        texto += `Nome: ${p.nome}\n`;
        texto += `CPF: ${p.cpf}\n`;
        texto += `SUS: ${p.sus}\n`;
        texto += `Nascimento: ${p.nascimento}\n`;
        texto += `Procedimento: ${p.procedimento}\n`;
        if (p.comunidade) texto += `Comunidade: ${p.comunidade}\n`;
        texto += `\n`;
      });

      navigator.clipboard.writeText(texto).then(() => {
        mostrarToast('📋 Dados copiados para a área de transferência!');
      }).catch(() => {
        mostrarToast('❌ Erro ao copiar');
      });
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    let toastT;
    function mostrarToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastT);
      toastT = setTimeout(() => t.classList.remove('show'), 2600);
    }

    renderizarPacientes();
  </script>
</body>
</html>
